[project]
name = "MedClip-pipeline"
version = "0.1.0"
description = "Multimodal biomedical image retrieval with BiomedCLIP and Qdrant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0.0",
    "fastapi>=0.139.0",
    "ftfy>=6.3.1",
    "numpy>=2.5.1",
    "open-clip-torch>=3.3.0",
    "opencv-python>=4.10.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "torch>=2.13.0",
    "transformers>=5.13.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]
