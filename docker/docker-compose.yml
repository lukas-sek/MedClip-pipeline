services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medclip_pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medclip_pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-medclip_pipeline}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medclip_pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medclip_pipeline}:${POSTGRES_PASSWORD:-medclip_pipeline}@postgres:5432/${POSTGRES_DB:-medclip_pipeline}
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: "6334"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:
