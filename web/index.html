<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedClip Search</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a222c;
        --border: #2c3845;
        --text: #e8eef4;
        --muted: #8b9aab;
        --accent: #3d9b8f;
        --accent-hover: #4db3a6;
        --danger: #d96b6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 10% -10%, #1e3a36 0%, transparent 50%),
          radial-gradient(ellipse 60% 40% at 100% 0%, #243044 0%, transparent 45%),
          var(--bg);
        color: var(--text);
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
      }

      header h1 {
        margin: 0 0 0.35rem;
        font-size: 1.75rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      header p {
        margin: 0 0 1.75rem;
        color: var(--muted);
        font-size: 0.95rem;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 0.75rem;
        align-items: end;
        margin-bottom: 1.75rem;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.8rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      input[type="text"],
      input[type="number"] {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 1rem;
        padding: 0.7rem 0.85rem;
        min-width: 0;
      }

      input[type="text"]:focus,
      input[type="number"]:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-color: var(--accent);
      }

      input[type="number"] {
        width: 5.5rem;
      }

      button {
        background: var(--accent);
        color: #04120f;
        border: none;
        border-radius: 8px;
        font-weight: 650;
        font-size: 0.95rem;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
        height: 2.75rem;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .status {
        min-height: 1.4rem;
        margin-bottom: 1rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status.error {
        color: var(--danger);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }

      article {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      article .thumb {
        aspect-ratio: 1;
        background: #0a0e12;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      article img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      article .thumb span {
        color: var(--muted);
        font-size: 0.8rem;
        padding: 1rem;
        text-align: center;
      }

      article .meta {
        padding: 0.85rem 0.95rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      article .score {
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }

      article .class {
        color: var(--accent);
        font-size: 0.9rem;
      }

      article .id {
        color: var(--muted);
        font-size: 0.75rem;
        word-break: break-all;
      }

      @media (max-width: 640px) {
        form {
          grid-template-columns: 1fr 1fr;
        }

        form label:first-child {
          grid-column: 1 / -1;
        }

        button {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>MedClip Search</h1>
        <p>Text-to-image retrieval over indexed biomedical embeddings.</p>
      </header>

      <form id="search-form">
        <label>
          Query
          <input
            id="query"
            type="text"
            name="query"
            placeholder="e.g. melanoma on the back"
            required
            autocomplete="off"
          />
        </label>
        <label>
          Top K
          <input id="top-k" type="number" name="top_k" value="5" min="1" max="100" />
        </label>
        <button type="submit" id="submit">Search</button>
      </form>

      <div id="status" class="status" aria-live="polite"></div>
      <section id="results" class="grid" aria-live="polite"></section>
    </main>

    <script>
      const form = document.getElementById("search-form");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      const submitBtn = document.getElementById("submit");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function mediaSrc(item) {
        if (item.media_url) return item.media_url;
        if (item.filename) return `/media/${item.filename}.jpg`;
        return null;
      }

      function renderResults(results) {
        resultsEl.innerHTML = "";
        if (!results.length) {
          setStatus("No matches found.");
          return;
        }
        setStatus(`${results.length} result${results.length === 1 ? "" : "s"}`);
        for (const item of results) {
          const card = document.createElement("article");
          const thumb = document.createElement("div");
          thumb.className = "thumb";
          const src = mediaSrc(item);
          if (src) {
            const img = document.createElement("img");
            img.src = src;
            img.alt = item.class || item.filename || "Result image";
            img.loading = "lazy";
            img.onerror = () => {
              thumb.innerHTML = "<span>Image not cached — re-run stream_index.py</span>";
            };
            thumb.appendChild(img);
          } else {
            thumb.innerHTML = "<span>No image</span>";
          }

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = `
            <div class="score">${Number(item.score).toFixed(4)}</div>
            <div class="class">${item.class ?? "unknown class"}</div>
            <div class="id">${item.filename ?? item.image_path ?? ""}</div>
          `;
          card.append(thumb, meta);
          resultsEl.appendChild(card);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = document.getElementById("query").value.trim();
        const topK = Number(document.getElementById("top-k").value) || 5;
        if (!query) return;

        submitBtn.disabled = true;
        setStatus("Searching…");
        resultsEl.innerHTML = "";

        try {
          const response = await fetch("/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, top_k: topK }),
          });
          if (!response.ok) {
            const detail = await response.text();
            throw new Error(detail || `HTTP ${response.status}`);
          }
          const data = await response.json();
          renderResults(data.results || []);
        } catch (err) {
          setStatus(err.message || "Search failed", true);
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
